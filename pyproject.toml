[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lending"
version = "0.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Os testes importam o pacote lending de src/ sem ser preciso instalá-lo com pip
pythonpath = ["src"]
testpaths = ["tests"]
